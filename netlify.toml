# Netlify settings for Pip Playground.
# The editor is in /public. "Connect with GitHub" runs as Netlify Functions in /netlify/functions.
# Deploy from a GitHub repository (Netlify Drop drag-and-drop does not run functions).
[build]
  publish = "public"
  functions = "netlify/functions"

# Versioned files (their names change when their content changes): keep for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The offline cache script must always be checked, so updates arrive right away.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
